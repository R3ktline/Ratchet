# Builds the Linux AppImage and the Windows installer. On a version tag
# (v1.2.3) it publishes them as a GitHub release whose notes are the
# annotated tag's message. Run it by hand to only build the files.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux AppImage
    runs-on: ubuntu-24.04
    container: fedora:43
    steps:
      - name: Install build dependencies
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git rust cargo cargo-c gcc meson ninja-build gtk4-devel libadwaita-devel
          libpng-devel libjpeg-turbo-devel libxml2-devel adwaita-icon-theme
          hicolor-icon-theme desktop-file-utils file wget findutils xz tar gettext

      - uses: actions/checkout@v5

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }

      - name: Build AppImage
        run: bash packaging/linux/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: Ratchet-*-x86_64.AppImage
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-gettext-tools

      - name: Build
        run: cargo build --release --locked

      - name: Bundle GTK runtime
        run: bash packaging/windows/bundle.sh

      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$version" packaging\windows\ratchet.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/installer/Ratchet-*-x64-setup.exe
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Fetch the annotated tag
        run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"

      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Ratchet ${GITHUB_REF_NAME#v}" \
            --notes-from-tag \
            --verify-tag
