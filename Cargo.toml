[package]
name = "ratchet"
version = "0.1.0"
edition = "2024"
license = "CC-BY-NC-SA-4.0"

[dependencies]
ab_glyph = "0.2"
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_8"] }
base64 = "0.23.1"
cairo-rs = { version = "0.22.9", features = ["pdf", "png", "v1_16"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
ratex-font = "0.1.14"
ratex-font-loader = { version = "0.1.14", features = ["embed-fonts"] }
ratex-layout = "0.1.14"
ratex-parser = "0.1.14"
ratex-types = "0.1.14"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[build-dependencies]
glib-build-tools = "0.22.8"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
